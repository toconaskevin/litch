name: Litch
description: Plan, apply, or check drift for one repository config.
inputs:
  command:
    description: plan, apply, or drift
    required: true
    default: plan
  config:
    description: Path to the repository config
    required: true
  kinds:
    description: Directory of ConfigDefinition files. A file replaces the packaged kind with the same metadata.name.
    required: false
    default: ""
  templates:
    description: Directory of workflow templates. The filename is the template name. Litch copies that file to .github/workflows/<name>.yml.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    - shell: bash
      run: pip install "${{ github.action_path }}"
    - shell: bash
      env:
        LITCH_COMMAND: ${{ inputs.command }}
        LITCH_CONFIG: ${{ inputs.config }}
        LITCH_KINDS: ${{ inputs.kinds }}
        LITCH_TEMPLATES: ${{ inputs.templates }}
      run: |
        case "$LITCH_COMMAND" in
          plan|apply|drift) ;;
          *) echo "command must be plan, apply, or drift" >&2; exit 2 ;;
        esac
        args=(litch "$LITCH_COMMAND" --config "$LITCH_CONFIG")
        if [ -n "$LITCH_KINDS" ]; then
          args+=(--definitions "$LITCH_KINDS")
        fi
        if [ -n "$LITCH_TEMPLATES" ]; then
          args+=(--templates "$LITCH_TEMPLATES")
        fi
        "${args[@]}"
