apiVersion: litch.dev/v1
kind: ConfigDefinition
metadata:
  name: custom01
spec:
  base: single-app
  required:
    - access
    - rulesets
    - codeowners
  defaults:
    secrets:
      provider: azure
    repo_settings:
      delete_branch_on_merge: true
      allow_merge_commit: false
  forbid:
    - actions.workflows
