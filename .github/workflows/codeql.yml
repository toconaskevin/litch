name: codeql
on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: python
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install .
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"
