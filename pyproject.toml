[project]
name = "litch"
version = "0.1.0"
description = "Declare GitHub repository access, rulesets, settings, secrets, workflows, and CODEOWNERS."
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6",
  "PyNaCl>=1.5",
  "PyJWT[crypto]>=2",
]

[project.scripts]
litch = "litch.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
litch = ["kinds/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
